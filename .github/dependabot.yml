version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      pre-commit:
        patterns: ["*"]

  # Dev tooling only. Bumping the floor on a runtime dependency drops support
  # for versions that work fine.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    allow:
      - dependency-type: "development"
    groups:
      dev-deps:
        patterns: ["*"]
