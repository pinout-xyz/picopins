[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "picopins"
dynamic = ["version", "readme"]
description = "A command-line pinout for the Raspberry Pi Pico, Pico W, Pico 2 and Pico 2 W"
license = {file = "LICENSE"}
requires-python = ">= 3.10"
authors = [
    { name = "Philip Howard", email = "pinout@gadgetoid.com" },
]
maintainers = [
    { name = "Philip Howard", email = "pinout@gadgetoid.com" },
]
keywords = [
    "Pico",
    "Raspberry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: System :: Hardware",
]
dependencies = ["rich>=13.3.5"]

[project.urls]
GitHub = "https://www.github.com/pinout-xyz/picopins"
Homepage = "https://pico.pinout.xyz"

[project.scripts]
picopins = "picopins.__main__:main"

[dependency-groups]
dev = [
    "check-manifest",
    "ruff==0.16.4",
    "codespell",
    "pre-commit",
    "twine",
    "hatch",
    "hatch-vcs",
    "hatch-fancy-pypi-readme",
    "tox",
]

# Normalises into either:
#   picopins-X.Y.Z             (on a vX.Y.Z tag)
#   picopins-X.Y.Z.postN+gHASH (N commits past vX.Y.Z)
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "post-release" }

[tool.hatch.build.hooks.vcs]
version-file = "picopins/_version.py"

[tool.hatch.build]
include = [
    "picopins",
    "README.md",
    "CHANGELOG.md",
    "LICENSE"
]

[tool.hatch.build.targets.sdist]
include = [
    "*"
]
exclude = [
    ".*",
    "dist",
    "uv.lock"
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [
  { path = "README.md" },
  { text = "\n" },
  { path = "CHANGELOG.md" }
]

[tool.ruff]
exclude = [
    '.tox',
    '.egg',
    '.git',
    '__pycache__',
    'build',
    'dist'
]
line-length = 200

[tool.ruff.lint]
extend-select = ["I", "UP", "SIM", "PIE", "C4", "B", "RUF", "PERF", "FURB", "PLE"]
ignore = [
    'E701'
]

[tool.codespell]
skip = """
./.tox,\
./.venv,\
./.egg,\
./.git,\
./__pycache__,\
./build,\
./dist\
"""

[tool.check-manifest]
ignore = [
    'Makefile',
    'tox.ini',
    'tests/*',
    'examples/*',
    '.coveragerc',
    '.editorconfig',
    '.pre-commit-config.yaml',
    'picopins/_version.py'
]
